<!DOCTYPE html>
<html>
<head>
  <title>Admin - Start Live Session</title>
</head>
<body style="text-align:center; font-family:sans-serif;">
  <h2>Admin Panel</h2>
  <button id="startBtn">START SESSION</button>
  <div id="output" style="margin-top:20px;"></div>

  <script>
    document.getElementById('startBtn').addEventListener('click', async () => {
      const res = await fetch('/start-session', { method: 'POST' });
      const data = await res.json();

      if (data.success) {
        document.getElementById('output').innerHTML = `
          <h3>Session Started!</h3>
          <p>Share this link with students:</p>
          <a href="${data.userurl}" target="_blank">${data.userurl}</a>
          <br><br>
          <video width="640" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
          </video>
        `;
      } else {
        document.getElementById('output').innerText = 'Error starting session';
      }
    });
  </script>
</body>
</html>
